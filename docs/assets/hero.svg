    <rect x="179" width="114" height="37" rx="18.5" fill="#172630" stroke="#2d414b"/><text x="197" y="24">Route guard</text>
    <rect x="306" width="164" height="37" rx="18.5" fill="#172630" stroke="#2d414b"/><text x="324" y="24">Request model badge</text>
  </g>
