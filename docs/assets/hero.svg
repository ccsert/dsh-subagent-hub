<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Subagent Hub — roles, routes, visibility</title>
  <desc id="desc">A dark developer banner with a restrained mint routing graph connecting a central hub to review, test, and research nodes.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1118"/><stop offset="1" stop-color="#121d27"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#66e2bf" stop-opacity=".15"/><stop offset="1" stop-color="#66e2bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x2="1" y2="1"><stop stop-color="#203439"/><stop offset="1" stop-color="#112028"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8ba3ad" opacity=".10"/></pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".24"/></filter>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}</style>
  </defs>
  <rect width="1600" height="640" rx="24" fill="url(#background)"/>
  <rect x="840" width="760" height="640" fill="url(#grid)"/>
  <ellipse cx="1220" cy="326" rx="365" ry="290" fill="url(#halo)"/>
  <path d="M856 54v532" stroke="#b1c4ca" stroke-opacity=".08"/>
  <g fill="#71e5c2"><rect x="92" y="91" width="7" height="7" rx="2"/><rect x="104" y="91" width="7" height="7" rx="2"/></g>
  <text x="126" y="101" font-size="15" font-weight="600" letter-spacing="2.6" fill="#9cafba">A COMPANION TO OFFICIAL DSH SUBAGENTS</text>
  <text x="90" y="243" font-size="82" font-weight="700" letter-spacing="-3" fill="#f3f7fa">Subagent Hub</text>
  <text x="95" y="306" font-size="31" font-weight="500" letter-spacing="-.5" fill="#b6cbd5">Named roles. Clear routes.</text>
  <text x="95" y="350" font-size="31" font-weight="500" letter-spacing="-.5" fill="#71e5c2">Visible models.</text>
  <text x="95" y="409" font-size="19" fill="#8ea5b2">Keep official dispatch. Add context and boundaries.</text>
