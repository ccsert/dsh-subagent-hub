# dsh-subagent-hub: one Host-only row. It reads `routes` and `agents` from the profile patch,
# registers each agent as an Agent Preset, and adds a system-prompt catalog plus a route guard to
# the official delegation tools. It does not replace them and adds no client UI.
#
#   - id: subagent-hub
#     config:
#       routes:                       # exact child models; also the official allowedModels list
#         - { id: flash, provider: <provider>, model: <model>, tags: [fast], note: <label> }
#         - { id: pro,   provider: <provider>, model: <model>, tags: [reasoning] }
#       agents:                       # each becomes preset `hub-agent-<id>`
#         - { id: reviewer, description: Reviews diffs, instructions: '...', routes: [pro] }
#       manageOfficialSettings: false # true == this plugin writes the official allowlists
- insert:
    - id: subagent-hub
      name: dsh-subagent-hub
