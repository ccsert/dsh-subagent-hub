# dsh-subagent-hub: one Host row plus one browser config card. It reads `routes` and `agents`
# (both live-editable from that card on the official Plugins page), registers each agent as an
# Agent Preset, and adds a system-prompt catalog plus a route guard to the official delegation
# tools. It does not replace them.
#
#   - id: subagent-hub
#     config:
#       routes:                       # exact child models; also the official allowedModels list
#         - { id: flash, provider: <provider>, model: <model>, tags: [fast], note: <label> }
#         - { id: pro,   provider: <provider>, model: <model>, tags: [reasoning] }
#       agents:                       # each becomes preset `hub-agent-<id>`
#         - { id: reviewer, description: Reviews diffs, instructions: '...', routes: [pro] }
#       maxConcurrent: 4              # children running at once per session; 0 = unlimited
#       manageOfficialSettings: false # true == this plugin writes the official allowlists
- insert:
    - id: subagent-hub
      name: dsh-subagent-hub
